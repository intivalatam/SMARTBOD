name: SMARTBOD - pruebas de integridad
on:
  push:
    branches: [main, mejoras-inventario-alertas-20261117]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: node --check public/app.js
      - run: node --check public/consumables-ui.js
